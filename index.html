<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>녹음 프롬프터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#101312; --panel:#171b1a; --line:#2a302e; --ink:#e9ece8; --dim:#66706b;
  --ready:#c9cfcb; --sing:#ffd23f; --rec:#ff5a4e; --ok:#5fd18b;
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
  --size:36px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);display:flex;flex-direction:column}
[hidden]{display:none!important}
button,select,input{font:inherit;color:var(--ink)}
button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sing);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
.bar b{color:var(--ink);font-size:15px;margin-right:8px}
.bar label{display:flex;gap:6px;align-items:center}
.bar input[type=range]{width:100px;accent-color:var(--sing)}
.bar input[type=number]{width:5.5em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.bar output{font-family:var(--mono);color:var(--ink)}
.small{font-size:13px;padding:5px 10px}
.wrap{flex:1;display:grid;grid-template-columns:220px 1fr;min-height:0}
nav{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.chip{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border-radius:10px;padding:8px 10px}
.chip .n{font-family:var(--mono);font-size:13px}
.chip .st{font-size:12px;color:var(--dim)}
.chip .pv{grid-column:1/-1;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.cur{border-color:var(--sing)}
.chip.saved .st{color:var(--ok)}
.chip.over .st{color:var(--rec)}
.stage{display:flex;flex-direction:column;gap:18px;padding:24px clamp(16px,4vw,48px);overflow:auto;min-width:0}
.meta{font-family:var(--mono);font-size:13px;color:var(--dim)}
.lines{display:flex;flex-direction:column;gap:.35em;max-width:30em}
.s{font-size:var(--size);line-height:1.5;font-weight:600;color:var(--ready);word-break:keep-all;overflow-wrap:anywhere}
.u{background-image:linear-gradient(90deg,var(--sing) var(--p,0%),var(--ready) var(--p,0%));-webkit-background-clip:text;background-clip:text}
.singing .u{-webkit-text-fill-color:transparent}
.meter{position:relative;height:14px;border-radius:7px;background:var(--line);max-width:36em;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--sing);width:0}
.meter .fill.over,.meter .fill.v-redo{background:var(--rec)}
.meter .fill.v-ok{background:var(--ok)}
.meter .fill.v-fix{background:var(--sing)}
.meter .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg);opacity:.9}
.verdict{display:inline-block;font-family:var(--font);font-weight:700;font-size:14px;padding:2px 10px;border-radius:999px;margin-right:8px}
.verdict.v-ok{background:var(--ok);color:#0d1a12}
.verdict.v-fix{background:var(--sing);color:#151510}
.verdict.v-redo{background:var(--rec);color:#fff}
.chip.v-ok .st{color:var(--ok)} .chip.v-fix .st{color:var(--sing)} .chip.v-redo .st{color:var(--rec)}
.mtxt{font-family:var(--mono);font-size:13px;color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
#rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700;min-width:8.5em}
#rec.on{background:transparent;color:var(--rec)}
#save{background:var(--ok);border-color:var(--ok);color:#0d1a12;font-weight:700}
.msg{min-height:1.5em;color:var(--dim);font-size:14px}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
#mergeBtn{background:var(--sing);border-color:var(--sing);color:#151510;font-weight:700}
footer audio{height:36px;max-width:100%}
#dl{color:var(--sing)}
.count{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9}
.count span{font-family:var(--mono);font-size:min(40vw,220px);color:var(--sing);text-shadow:0 0 40px #000}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(760px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
textarea{width:100%;min-height:280px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.6 var(--mono)}
.drow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.err{color:var(--rec);font-size:13px;min-height:1.2em}
button:disabled{filter:grayscale(1)}
@media (max-width:640px){
  html,body{height:auto}
  body{display:block;min-height:100%}
  .wrap{display:block}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .chip{width:170px;flex:none}
  .stage{overflow:visible;padding:18px 16px 24px}
  .btns button{flex:1 1 40%}
  footer{position:sticky;bottom:0}
  :root{--size:27px}
}
</style>
</head>
<body>
<div class="bar">
  <b>녹음 프롬프터</b>
  <label>속도 <input id="rate" type="range" min="4" max="8" step="0.1" value="5.0"><output id="rateOut">5.0</output>음절/초</label>
  <label>글자 <input id="size" type="range" min="20" max="56" step="2" value="36"></label>
  <label>카운트 <select id="pre"><option value="3">3초</option><option value="2" selected>2초</option><option value="1">1초</option></select></label>
  <label>영상 길이 <input id="vlen" type="number" step="0.01" min="1" value="60.58">초</label>
  <button class="small" id="editBtn">대본 바꾸기</button>
  <span>스페이스 = 녹음/멈춤 · Enter = 저장</span>
</div>

<div class="wrap">
  <nav id="list"></nav>
  <section class="stage">
    <div class="meta" id="meta"></div>
    <div class="lines" id="lines"></div>
    <div>
      <div class="meter"><div class="fill" id="fill"></div><i class="tick" style="left:calc(65%/1.1)"></i><i class="tick" style="left:calc(75%/1.1)"></i><i class="tick" style="left:calc(100%/1.1)"></i></div>
      <div class="mtxt" id="mtxt"></div>
    </div>
    <div class="btns">
      <button id="rec">● 녹음하기</button>
      <button id="play" disabled>▶ 들어보기</button>
      <button id="redo" disabled>↺ 다시 녹음</button>
      <button id="save" disabled>✓ 저장하고 다음</button>
    </div>
    <div class="msg" id="msg">● 녹음하기를 누르면 카운트다운 후 녹음이 시작되고 글자가 차오릅니다. 다 읽으면 다시 눌러 멈추세요.</div>
  </section>
</div>

<footer>
  <button id="mergeBtn">전체 합치기</button>
  <span class="mtxt" id="mergeInfo">저장된 뭉탱이 0개</span>
  <audio id="mergeAudio" controls hidden></audio>
  <a id="dl" hidden>합본 M4A 받기</a>
</footer>

<div class="count" id="count" hidden><span id="countN"></span></div>

<dialog id="dlg">
  <p class="mtxt">한 줄 = 한 뭉탱이(컷). 형식: <b>시작초|문장 / 문장</b> — 시작초는 원본 영상에서 그 뭉탱이를 읽기 시작할 시각. 이름을 붙이려면 <b>시작초|이름|문장 / 문장</b>. #으로 시작하는 줄은 무시. 대본을 바꾸면 저장된 녹음은 이 대본과 따로 보관됩니다.</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="err" id="err"></div>
  <div class="drow"><button id="restore">쿠네쿠네 대본으로</button><button id="cancel">닫기</button><button id="apply">적용</button></div>
</dialog>

// ---------- merge ----------
$("mergeBtn").onclick=async()=>{
  const saved=paras.map((_,k)=>takes[k]&&takes[k].saved?k:-1).filter(k=>k>=0);
  if(!saved.length){ msg("저장된 뭉탱이가 없어요."); return; }
  const sr=48000, notes=[]; let prevEnd=0, place=[];
  for(const k of saved){ const tk=takes[k];
    let at=paras[k].t+VOICE_AT-PREROLL; if(at<prevEnd+0.05){ notes.push(`${label(k)} ${(prevEnd+0.05-at).toFixed(2)}초 밀림`); at=prevEnd+0.05; }
    const dur=Math.min(tk.len+PREROLL+0.6, tk.buf.duration-Math.max(0,tk.onset-PREROLL)); place.push({k,at,dur}); prevEnd=at+tk.len+PREROLL; }
  const total=Math.max(+$("vlen").value||0, prevEnd+0.5);
  const out=new Float32Array(Math.ceil(total*sr));
  for(const {k,at,dur} of place){ const b=takes[k].buf, from=Math.max(0,takes[k].onset-PREROLL);
    const chs=[]; for(let c=0;c<b.numberOfChannels;c++) chs.push(b.getChannelData(c));
    const ratio=b.sampleRate/sr, n=Math.floor(dur*sr), o=Math.round(at*sr);
    for(let i=0;i<n&&o+i<out.length;i++){ const si=Math.floor(from*b.sampleRate+i*ratio); if(si>=chs[0].length) break;
      let v=0; for(const ch of chs) v+=ch[si]; v/=chs.length;
      const fi=Math.min(1,i/(0.01*sr),(n-i)/(0.03*sr)); out[o+i]+=v*fi; } }
  let pk=0; for(const v of out){const a=Math.abs(v); if(a>pk)pk=a;}
  const g=pk>0?0.89/pk:1;
  for(let i=0;i<out.length;i++) out[i]=Math.max(-1,Math.min(1,out[i]*g));
  const d=new Date(), stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}`;
  $("mergeBtn").disabled=true; $("mergeInfo").textContent="M4A로 만드는 중…";
  let blob, ext="m4a", fmtNote="";
  try{ blob=await toM4A(out,sr); }
  catch(e){ blob=toWAV(out,sr); ext="wav"; fmtNote=" · 이 브라우저는 M4A를 못 만들어서 WAV로 저장"; }
  $("mergeBtn").disabled=false;
  const url=URL.createObjectURL(blob);
  const a=$("dl"); a.href=url; a.download=`녹음_합본_${stamp}.${ext}`; a.textContent=`합본 ${ext.toUpperCase()} 받기`; a.hidden=false;
  const au=$("mergeAudio"); au.src=url; au.hidden=false;
  $("mergeInfo").textContent=`${saved.length}/${paras.length}개 합침 · ${total.toFixed(2)}초`+(saved.length<paras.length?" · 빠진 뭉탱이는 무음":"")+(notes.length?" · "+notes.join(", "):"")+fmtNote;
};

function toWAV(out,sr){
  const wav=new DataView(new ArrayBuffer(44+out.length*2)); const w=(o,s)=>{for(let i=0;i<s.length;i++)wav.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");wav.setUint32(4,36+out.length*2,true);w(8,"WAVE");w(12,"fmt ");wav.setUint32(16,16,true);wav.setUint16(20,1,true);wav.setUint16(22,1,true);
  wav.setUint32(24,sr,true);wav.setUint32(28,sr*2,true);wav.setUint16(32,2,true);wav.setUint16(34,16,true);w(36,"data");wav.setUint32(40,out.length*2,true);
  for(let i=0;i<out.length;i++){ const v=out[i]; wav.setInt16(44+i*2,v<0?v*0x8000:v*0x7fff,true); }
  return new Blob([wav],{type:"audio/wav"});
}
async function toM4A(mono,sr){
  if(!("AudioEncoder" in window) || !window.Mp4Muxer) throw new Error("unsupported");
  let ch=0, cfg;
  for(const n of [1,2]){ cfg={codec:"mp4a.40.2",sampleRate:sr,numberOfChannels:n,bitrate:192000};
    try{ if((await AudioEncoder.isConfigSupported(cfg)).supported){ ch=n; break; } }catch(e){} }
  if(!ch) throw new Error("unsupported");
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),audio:{codec:"aac",sampleRate:sr,numberOfChannels:ch},fastStart:"in-memory"});
  let err=null;
  const enc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{err=e}});
  enc.configure(cfg);
  const F=4800;
  for(let i=0;i<mono.length;i+=F){
    const n=Math.min(F,mono.length-i), part=mono.subarray(i,i+n);
    const data=new Float32Array(n*ch); for(let c=0;c<ch;c++) data.set(part,c*n);
    const ad=new AudioData({format:"f32-planar",sampleRate:sr,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(i/sr*1e6),data});
    enc.encode(ad); ad.close();
    if(err) break;
  }
  await enc.flush(); enc.close(); if(err) throw err;
  muxer.finalize();
  return new Blob([muxer.target.buffer],{type:"audio/mp4"});
}

// ---------- settings ----------
$("rate").oninput=e=>{ rate=+e.target.value; $("rateOut").textContent=rate.toFixed(1); if(!recording) show(); };
$("size").oninput=e=>document.documentElement.style.setProperty("--size",e.target.value+"px");
$("vlen").onchange=()=>show();
$("editBtn").onclick=()=>{ $("ta").value=scriptText; $("err").textContent=""; $("dlg").showModal(); };
$("cancel").onclick=()=>$("dlg").close();
$("restore").onclick=()=>{ $("ta").value=DEFAULT; };
$("apply").onclick=async()=>{ try{ parse($("ta").value); }catch(e){ $("err").textContent=e.message; return; }
  scriptText=$("ta").value; try{localStorage.setItem("prompter_script",scriptText)}catch(e){} $("dlg").close(); await load(); };

async function load(){
  paras=parse(scriptText); takes={}; cur=0;
  for(let k=0;k<paras.length;k++){ const blob=await dbGet(k); if(blob){ try{ takes[k]={blob,...await analyse(blob),saved:true}; }catch(e){} } }
  const first=paras.findIndex((_,k)=>!(takes[k]&&takes[k].saved)); cur=first>=0?first:0;
  if(Object.keys(takes).length) msg("이전에 저장한 녹음을 불러왔어요. 이어서 녹음하세요.");
  show();
}
(async()=>{ idb=await openDB(); await load(); })();
